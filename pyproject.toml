[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "coding-agent-1021"
version = "0.1.0"
description = "A personal DeepSeek-powered coding agent, built incrementally."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27,<1",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
coding-agent = "personal_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

